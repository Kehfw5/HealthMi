name: HealthMi
options:
  bundleIdPrefix: app.lotus9796
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "2RM563997N"
    ENABLE_TESTABILITY: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HealthMi:
    type: application
    platform: iOS
    sources:
      - path: HealthMi
        excludes:
          - "Support/Info.plist"
    dependencies:
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lotus9796.mulberry6185
        PRODUCT_NAME: HealthMi
        INFOPLIST_FILE: HealthMi/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HealthMi/Support/HealthMi.entitlements
      properties:
        com.apple.developer.healthkit: true

  HealthMiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthMiTests
    dependencies:
      - target: HealthMi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lotus9796.mulberry6185.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthMi.app/HealthMi"
        BUNDLE_LOADER: "$(TEST_HOST)"
