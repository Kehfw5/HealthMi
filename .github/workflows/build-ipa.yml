name: Build IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  PROJECT_FILE: HealthMi.xcodeproj
  SCHEME: HealthMi
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  BUNDLE_ID: app.lotus9796.mulberry6185
  ARCHIVE_PATH: build/HealthMi.xcarchive
  IPA_PATH: build/HealthMi.ipa

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app | head -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::Xcode 16 not found. Swift 6.0 requires Xcode 16+."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build settings
        run: |
          xcodebuild -project "$PROJECT_FILE" -scheme "$SCHEME" -configuration "$CONFIGURATION" -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION|CODE_SIGN_STYLE" || true

      # ===== 正式签名路径（需配置 Secrets 才会执行）=====
      # 需要在 GitHub 仓库 Secrets 中配置：
      #   IOS_CODE_SIGN_IDENTITY   - 证书名称，例如 "Apple Development: xxx (TEAMID)"
      #   IOS_DEVELOPMENT_TEAM     - 开发者团队 ID，例如 "ABCDE12345"
      #   IOS_P12_CERT_BASE64      - .p12 证书文件的 base64 编码
      #   IOS_P12_PASSWORD         - .p12 证书的密码
      #   IOS_PROVISIONING_PROFILE - .mobileprovision 文件的 base64 编码
      #   KEYCHAIN_PASSWORD        - 临时钥匙串密码
      - name: Import code signing credentials
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        env:
          P12_CERT_BASE64: ${{ secrets.IOS_P12_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          echo "Importing code signing credentials..."

          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # 导入证书
          echo "$P12_CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # 导入描述文件
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          # 列出已安装的签名身份
          security find-identity -v -p codesigning build.keychain

          # 设置默认钥匙串
          security list-keychains -d user -s build.keychain

          rm -f certificate.p12 profile.mobileprovision

      - name: Archive (signed)
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_ENTITLEMENTS=HealthMi/Support/HealthMi.entitlements

      - name: Export IPA (signed)
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        run: |
          set -eo pipefail
          # 生成 exportOptions.plist（去掉前导空白，避免 plist 解析问题）
          sed 's/^[[:space:]]*//' > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
              <key>signingCertificate</key>
              <string>${{ secrets.IOS_CODE_SIGN_IDENTITY }}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          plutil -lint exportOptions.plist

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist

          # 重命名导出的 IPA
          EXPORTED_IPA=$(ls build/*.ipa | head -1)
          if [ -n "$EXPORTED_IPA" ]; then
            cp "$EXPORTED_IPA" "$IPA_PATH"
          fi

      # ===== 默认路径：未签名 IPA（无需任何凭证）=====
      - name: Archive (unsigned)
        if: ${{ vars.IOS_SIGNING_ENABLED != 'true' }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA (unsigned)
        if: ${{ vars.IOS_SIGNING_ENABLED != 'true' }}
        run: |
          set -eo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/HealthMi.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            ls -la "$ARCHIVE_PATH/Products/Applications/" || true
            exit 1
          fi

          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/

          cd build/IPA
          zip -qr ../HealthMi.ipa Payload
          cd ../..

          echo "IPA size: $(du -h "$IPA_PATH" | cut -f1)"

      - name: Verify IPA
        run: |
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not generated at $IPA_PATH"
            exit 1
          fi
          echo "=== IPA generated successfully ==="
          ls -la "$IPA_PATH"
          echo ""
          echo "=== IPA contents ==="
          unzip -l "$IPA_PATH" | head -30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-${{ env.CONFIGURATION }}-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 90

      - name: Cleanup keychain
        if: ${{ always() && vars.IOS_SIGNING_ENABLED == 'true' }}
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
