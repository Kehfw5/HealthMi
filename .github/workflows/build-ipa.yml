name: Build IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  PROJECT_FILE: HealthMi.xcodeproj
  SCHEME: HealthMi
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  BUNDLE_ID: app.lotus9796.mulberry6185
  ARCHIVE_PATH: build/HealthMi.xcarchive
  IPA_PATH: build/HealthMi.ipa

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::Xcode 16 not found. Swift 6.0 requires Xcode 16+."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build settings
        run: |
          xcodebuild -project "$PROJECT_FILE" -scheme "$SCHEME" -configuration "$CONFIGURATION" -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION|CODE_SIGN_STYLE" || true

      # ===== 正式签名路径（需配置 Secrets 才会执行）=====
      - name: Import code signing credentials
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        env:
          P12_CERT_BASE64: ${{ secrets.IOS_P12_CERT_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          echo "Importing code signing credentials..."

          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # 解码 P12
          printf '%s' "$P12_CERT_BASE64" | base64 -D > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "::error::P12 解码失败，文件为空。请检查 IOS_P12_CERT_BASE64 是否完整。"
            exit 1
          fi

          # 用 OpenSSL 提取证书和私钥为 PEM（绕过 macOS security import 的 P12 MAC 兼容性问题）
          if ! openssl pkcs12 -in certificate.p12 -nokeys -out cert.pem -passin pass: 2>openssl.err; then
            echo "::error::OpenSSL 无法读取 P12，请检查 IOS_P12_CERT_BASE64 是否正确。"
            cat openssl.err 2>/dev/null || true
            exit 1
          fi
          openssl pkcs12 -in certificate.p12 -nocerts -nodes -out key.pem -passin pass: 2>/dev/null
          rm -f openssl.err

          if [ ! -s cert.pem ] || [ ! -s key.pem ]; then
            echo "::error::证书或私钥提取失败。"
            exit 1
          fi

          # 分别导入证书和私钥（PEM 格式无 MAC 验证问题）
          security import cert.pem -k build.keychain -T /usr/bin/codesign >/dev/null 2>&1
          security import key.pem -k build.keychain -T /usr/bin/codesign >/dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null 2>&1

          # 导入描述文件
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision 2>/dev/null | plutil -extract UUID raw - 2>/dev/null)
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::描述文件解析失败，请检查 IOS_PROVISIONING_PROFILE 是否完整复制。"
            exit 1
          fi
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Profile imported (UUID hidden)."

          # 验证签名身份已安装
          IDENTITY_COUNT=$(security find-identity -v -p codesigning build.keychain 2>/dev/null | grep -c "iPhone\|Apple")
          if [ "$IDENTITY_COUNT" -lt 1 ]; then
            echo "::error::钥匙串中未找到有效的代码签名身份。"
            security find-identity -p codesigning build.keychain
            exit 1
          fi
          echo "Signing identity installed ($IDENTITY_COUNT found)."

          # 设置默认钥匙串
          security list-keychains -d user -s build.keychain >/dev/null 2>&1

          rm -f certificate.p12 cert.pem key.pem profile.mobileprovision

      - name: Archive (signed)
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_ENTITLEMENTS=HealthMi/Support/HealthMi.entitlements

      - name: Export IPA (signed)
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        run: |
          set -eo pipefail
          sed 's/^[[:space:]]*//' > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
              <key>signingCertificate</key>
              <string>${{ secrets.IOS_CODE_SIGN_IDENTITY }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ env.BUNDLE_ID }}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          plutil -lint exportOptions.plist

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build \
            -exportOptionsPlist exportOptions.plist

          EXPORTED_IPA=$(ls build/*.ipa 2>/dev/null | head -1)
          if [ -n "$EXPORTED_IPA" ] && [ "$EXPORTED_IPA" != "$IPA_PATH" ]; then
            cp "$EXPORTED_IPA" "$IPA_PATH"
          fi

      # ===== 默认路径：未签名 IPA（无需任何凭证）=====
      - name: Archive (unsigned)
        if: ${{ vars.IOS_SIGNING_ENABLED != 'true' }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA (unsigned)
        if: ${{ vars.IOS_SIGNING_ENABLED != 'true' }}
        run: |
          set -eo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/HealthMi.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            ls -la "$ARCHIVE_PATH/Products/Applications/" || true
            exit 1
          fi

          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/

          cd build/IPA
          zip -qr ../HealthMi.ipa Payload
          cd ../..

          echo "IPA size: $(du -h "$IPA_PATH" | cut -f1)"

      - name: Verify IPA
        run: |
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not generated at $IPA_PATH"
            exit 1
          fi
          echo "=== IPA generated successfully ==="
          ls -la "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-${{ env.CONFIGURATION }}-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 90

      - name: Cleanup keychain
        if: ${{ always() && vars.IOS_SIGNING_ENABLED == 'true' }}
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
